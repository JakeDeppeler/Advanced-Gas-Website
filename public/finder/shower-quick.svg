<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" role="img" aria-label="A shower running, its timer a third of the way round"><style>.dr{fill:none;stroke-linecap:round;stroke-dasharray:3 7;animation:drip .7s linear infinite}@keyframes drip{to{stroke-dashoffset:-20}}.st{animation:steam 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes steam{from{transform:translateY(8px) scale(.6);opacity:0}35%{opacity:.85}to{transform:translateY(-16px) scale(1.15);opacity:0}}.dl{animation:dial 1.6s .4s cubic-bezier(.3,.7,.3,1) both}@keyframes dial{from{stroke-dasharray:0 100}}@media (prefers-reduced-motion:reduce){.dr,.st,.dl{animation:none}}</style><defs><pattern id="tl" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#E3F2FA"/><path d="M0 .5H16M.5 0V16" stroke="#fff" stroke-width="1.2"/></pattern></defs><rect width="360" height="190" fill="url(#tl)"/><rect y="160" width="360" height="30" fill="#C9D6E0"/><g stroke="#B6C5D1"><line x1="0" y1="180" x2="360" y2="180"/><line x1="0" y1="200" x2="360" y2="200"/></g><rect x="96" y="22" width="92" height="140" fill="#fff" opacity=".22" stroke="#fff" stroke-width="2"/><path d="M118 0 V30 Q118 40 128 42" fill="none" stroke="#AEB7C4" stroke-width="4" stroke-linecap="round"/><path d="M126 40 L152 40 L148 50 L130 50Z" fill="#C9D0DA" stroke="#8C99AD" stroke-width="1.2"/><path class="dr" style="animation-delay:-0.00s" d="M132 53 L116 156" stroke="#5FB8E8" stroke-width="1.6"/><path class="dr" style="animation-delay:-0.19s" d="M134.6 53 L124 156" stroke="#5FB8E8" stroke-width="1.6"/><path class="dr" style="animation-delay:-0.38s" d="M137.2 53 L132 156" stroke="#5FB8E8" stroke-width="1.6"/><path class="dr" style="animation-delay:-0.57s" d="M139.8 53 L140 156" stroke="#5FB8E8" stroke-width="1.6"/><path class="dr" style="animation-delay:-0.76s" d="M142.4 53 L148 156" stroke="#5FB8E8" stroke-width="1.6"/><path class="dr" style="animation-delay:-0.95s" d="M145 53 L156 156