<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" role="img" aria-label="A mains gas meter on the outside wall, its dial turning"><style>.f{animation:pop .5s cubic-bezier(.2,.9,.25,1.25) both;transform-box:fill-box;transform-origin:50% 100%}@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}.dr{fill:none;stroke-linecap:round;stroke-dasharray:3 7;animation:drip .7s linear infinite}@keyframes drip{to{stroke-dashoffset:-20}}.fan{animation:spin 2.4s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.f,.dr,.fan{animation:none}}</style><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE8FA"/><stop offset="1" stop-color="#F2F8FD"/></linearGradient>
