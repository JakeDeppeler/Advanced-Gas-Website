<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>AGA Team Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: frosted sidebar + one working column; every page = title, tabs, one status sentence, one main block, In plain words. Colour only for status. */
:root{
  --page:#f5f5f7; --surface:#ffffff; --sunken:#f1f1f3; --side:rgba(246,246,248,.92); --side-on:rgba(0,0,0,.07);
  --ink:#1d1d1f; --ink2:#6e6e73; --ink3:#86868b; --ink4:#c7c7cc;
  --line:rgba(60,60,67,.12); --quiet:rgba(118,118,128,.12); --track:rgba(118,118,128,.16);
  --mark:#1d1d1f; --on-mark:#ffffff;
  --good:#1f7a35; --good-f:#34c759; --good-bg:rgba(52,199,89,.14);
  --mid:#6e6e73; --mid-f:#8e8e93; --mid-bg:rgba(118,118,128,.12);
  --accent:#0071e3; --accent-bg:rgba(0,113,227,.1); --on-accent:#ffffff;
  --bad:#d70015; --bad-f:#ff3b30; --bad-bg:rgba(215,0,21,.08);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
  --seg-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hero-bg:#1d1d1f; --hero-ink:#ffffff; --hero-ink2:rgba(255,255,255,.72); --hero-track:rgba(255,255,255,.18);
  --tv:#0a0a0b; --tv-card:#1c1c1e; --tv-track:#2c2c2e; --tv-ink:#ffffff; --tv-ink2:#a1a1a6; --tv-bad:#ff6961;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#111113; --surface:#1c1c1e; --sunken:#242427; --side:rgba(24,24,26,.94); --side-on:rgba(255,255,255,.09);
  --ink:#f5f5f7; --ink2:#a1a1a6; --ink3:#8e8e93; --ink4:#48484a;
  --line:rgba(255,255,255,.1); --quiet:rgba(255,255,255,.08); --track:rgba(255,255,255,.12);
  --mark:#f5f5f7; --on-mark:#111113;
  --good:#30d158; --good-f:#30d158; --good-bg:rgba(48,209,88,.16);
  --mid:#a1a1a6; --mid-f:#8e8e93; --mid-bg:rgba(255,255,255,.08);
  --accent:#0a84ff; --accent-bg:rgba(10,132,255,.16); --on-accent:#ffffff;
  --bad:#ff6961; --bad-f:#ff453a; --bad-bg:rgba(255,69,58,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3); --seg-shadow:0 2px 6px rgba(0,0,0,.4); --hero-bg:#f5f5f7; --hero-ink:#111113; --hero-ink2:rgba(0,0,0,.62); --hero-track:rgba(0,0,0,.14); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#111113; --surface:#1c1c1e; --sunken:#242427; --side:rgba(24,24,26,.94); --side-on:rgba(255,255,255,.09);
  --ink:#f5f5f7; --ink2:#a1a1a6; --ink3:#8e8e93; --ink4:#48484a;
  --line:rgba(255,255,255,.1); --quiet:rgba(255,255,255,.08); --track:rgba(255,255,255,.12);
  --mark:#f5f5f7; --on-mark:#111113;
  --good:#30d158; --good-f:#30d158; --good-bg:rgba(48,209,88,.16);
  --mid:#a1a1a6; --mid-f:#8e8e93; --mid-bg:rgba(255,255,255,.08);
  --accent:#0a84ff; --accent-bg:rgba(10,132,255,.16); --on-accent:#ffffff;
  --bad:#ff6961; --bad-f:#ff453a; --bad-bg:rgba(255,69,58,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3); --seg-shadow:0 2px 6px rgba(0,0,0,.4); --hero-bg:#f5f5f7; --hero-ink:#111113; --hero-ink2:rgba(0,0,0,.62); --hero-track:rgba(0,0,0,.14); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
input[type=range]{accent-color:var(--accent)}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* frame */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;background:var(--side);backdrop-filter:blur(30px) saturate(1.6);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.biz{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--mark);color:var(--on-mark);font-family:var(--f-display);font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.biz b{font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:-.01em;display:block;line-height:1.1}
.biz span{font-size:12px;color:var(--ink2)}
.biz .logo{color:var(--on-mark);font-size:13px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:none;border-radius:8px;font-size:14px;font-weight:500;text-align:left;color:var(--ink)}
.nav-btn:hover{background:var(--quiet)}
.nav-btn.on{background:var(--side-on);font-weight:700}
.nav-btn svg{color:var(--ink2);flex:none}
.nav-btn .n{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:600}
.nav-btn .n.r{color:var(--bad)}
.nav-sub{display:block;width:100%;border:0;background:none;text-align:left;padding:5px 10px 5px 40px;border-radius:8px;font-size:13px;color:var(--ink2)}
.nav-sub:hover{background:var(--quiet)}
.nav-sub.on{color:var(--accent);font-weight:700}
.nav-sep{height:1px;background:var(--line);margin:8px 10px}

/* minimised sidebar */
.side-tog{margin-left:auto;width:24px;height:24px;border-radius:99px;border:0;background:var(--quiet);color:var(--ink2);font-size:14px;line-height:1;flex:none;display:inline-flex;align-items:center;justify-content:center}
.side-tog:hover{background:var(--side-on);color:var(--ink)}
.nav-sub .n{float:right;font-size:12px;color:var(--ink3);font-weight:600}
.nav-sub .n.r{color:var(--bad)}
.flyout{position:fixed;left:70px;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.18);padding:10px;min-width:210px}
.flyout b{display:block;font-family:var(--f-display);font-size:13px;font-weight:800;padding:4px 10px 8px}
.flyout .nav-sub{padding:7px 10px}
@media (min-width:821px){
  body.side-mini .app{grid-template-columns:64px minmax(0,1fr)}
  body.side-mini .side{padding:16px 8px;overflow:visible}
  body.side-mini .biz{flex-direction:column;gap:8px;padding:0 0 10px}
  body.side-mini .biz > span:not(.logo){display:none}
  body.side-mini .side-tog{margin:0}
  body.side-mini .nav-btn{justify-content:center;padding:9px 0;gap:0}
  body.side-mini .nav-btn .nl,body.side-mini .nav-btn .chev-n,body.side-mini .nav-btn .n{display:none}
  body.side-mini .nav-btn{position:relative}
  body.side-mini .nav-btn .n.r{display:block;position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:99px;background:var(--bad);font-size:0;overflow:hidden}
  body.side-mini .side > .nav-sub{display:none}
  body.side-mini .nav-sep{margin:8px 4px}
  body.side-mini .side-foot{justify-content:center;padding:12px 0 4px}
  body.side-mini .side-foot > *:not(.logo){display:none}
}
.tblocks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.tblock{background:var(--sunken);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tblock .tl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.tblock b{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.tblock .ts{font-size:12px;color:var(--ink2);line-height:1.35}
@media (max-width:1100px){.tblocks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.tblocks{grid-template-columns:minmax(0,1fr)}.tblock b{font-size:26px}}
.side-foot{margin-top:auto;padding:12px 10px 4px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2)}
.side-foot .logo{width:28px;height:28px;border-radius:99px;font-size:11px}
.live{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:52px;display:flex;align-items:center;gap:12px;padding:0 32px;background:color-mix(in srgb,var(--page) 80%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.crumb{font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:700}
.theme-btn{border:0;background:var(--quiet);border-radius:99px;height:30px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink)}
.sample{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink2);background:var(--quiet);padding:4px 10px;border-radius:99px;white-space:nowrap}
.menu-btn{display:none;border:0;background:var(--quiet);border-radius:8px;width:34px;height:34px;align-items:center;justify-content:center}
.content{padding:24px 40px 56px;display:flex;flex-direction:column;gap:18px;max-width:1480px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--ink2);margin-top:4px}
.say .b{color:var(--bad);font-weight:800}
.say .g{color:var(--good);font-weight:800}

/* segmented tabs */
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--quiet);max-width:100%;overflow-x:auto;scrollbar-width:none;align-self:flex-start}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.seg button.on{background:var(--surface);box-shadow:var(--seg-shadow);font-weight:800}
.seg .c{font-size:11px;font-weight:700;color:var(--ink3)}
.seg .c.r{color:var(--bad)}

/* surfaces */
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);min-width:0}
.pad{padding:18px 20px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.card-h b{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-.01em}
.card-h span{font-size:13px;color:var(--ink3)}
.lh{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px 4px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.two{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

/* status */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;white-space:nowrap;padding:3px 10px;border-radius:99px}
.st i{width:7px;height:7px;border-radius:99px;display:block}
.st.good{color:var(--good);background:var(--good-bg)} .st.good i{background:var(--good-f)}
.st.mid{color:var(--mid);background:var(--mid-bg)} .st.mid i{background:var(--mid-f)}
.st.bad{color:var(--bad);background:var(--bad-bg)} .st.bad i{background:var(--bad-f)}
.st.none{color:var(--ink3);background:var(--quiet)} .st.none i{background:var(--ink4)}
/* the current site's dark hero card */
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:20px;padding:20px 24px;min-width:0}
.hero .hl{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--hero-ink2);font-weight:600}
.hero .hf{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:6px 0 12px;font-variant-numeric:tabular-nums}
.hero .hb{height:8px;border-radius:99px;background:var(--hero-track);overflow:hidden}.hero .hb i{display:block;height:100%;border-radius:99px;background:var(--hero-ink)}
.hero .hs{font-weight:600;margin-top:12px;font-size:14px}
.hero.light{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hero.light .hl{color:var(--ink2)} .hero.light .hb{background:var(--track)} .hero.light .hb i{background:var(--mark)}
:root.big body{zoom:1.1}
.bigin{width:100%;font-size:15px;font-weight:600;padding:12px 16px;border-radius:14px;border:0;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.bigin:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
textarea.bigin{min-height:84px;resize:vertical;font-size:14px;font-weight:500;line-height:1.4;font-family:var(--f-body)}
.addcard{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.edit-box{display:flex;flex-direction:column;gap:10px;padding:6px 0 4px}
.tlink{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:text;display:block;width:100%;min-width:0;max-width:100%}
.tlink:hover b{text-decoration:underline;text-decoration-color:var(--ink4)}
.pname{border:0;background:none;padding:0;text-align:left;color:var(--ink);font-size:15px;font-weight:700}
.pname:hover{text-decoration:underline}
.td .t .pname span{display:inline;font-size:inherit;margin:0}
.fp{padding:14px 14px}
.idea-t{border:0;background:none;padding:0;text-align:left;width:100%;display:block;color:var(--ink)}
.idea-t b{font-size:14.5px;line-height:1.3;display:block}
.idea-t span{font-size:12.5px;color:var(--ink2);display:block;margin-top:4px;line-height:1.4}
.idea-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.prof-h{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prof-h .av{width:64px;height:64px;font-size:26px;font-family:var(--f-display);font-weight:800;background:var(--mark);color:var(--on-mark)}
.tl-item{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.tl-item:first-child{border-top:0}
.tl-item .k{font-weight:800;font-size:12px;color:var(--ink2)}
.chipb{border:0;background:var(--quiet);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink)}
.chipb:hover{background:var(--side-on)}
.vote{white-space:nowrap;border:0;background:var(--quiet);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:800;color:var(--ink);display:inline-flex;gap:5px;align-items:center}
.vote.on{background:var(--mark);color:var(--on-mark)}
.opt{display:flex;gap:12px;flex-wrap:wrap}
.opt button{border:0;background:var(--surface);border-radius:16px;padding:12px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-weight:700;min-width:150px}
.opt button.on{box-shadow:0 0 0 2px var(--mark)}
.opt .sw{width:132px;height:78px;border-radius:10px;display:grid;grid-template-columns:30px 1fr;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.toggle{width:46px;height:28px;border-radius:99px;border:0;background:var(--track);position:relative;flex:none;padding:0}
.toggle i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.toggle.on{background:var(--good-f)} .toggle.on i{left:21px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.statement,.say{font-family:var(--f-body);font-weight:700;font-size:17px;line-height:1.4;letter-spacing:-.005em;margin:0;max-width:none;text-wrap:pretty;color:var(--ink)}
.statement b,.say b{font-weight:800}
.infob{margin-left:auto;align-self:center;border:0;background:var(--quiet);border-radius:99px;height:30px;padding:0 12px 0 6px;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ink2)}
.infob span{width:18px;height:18px;border-radius:99px;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font:italic 800 11px/1 Georgia,serif;box-shadow:0 0 0 1px var(--line)}
.infob:hover{color:var(--ink)}
.infop{padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 22px;font-size:13px;color:var(--ink2)}
.infop b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.statement .b{color:var(--bad)} .statement .g{color:var(--good)}
.homek{text-align:left;border:0;width:100%;color:var(--ink)} .homek:hover{box-shadow:0 0 0 2px var(--line),var(--shadow)}
.stepper{display:inline-flex;align-items:center;gap:10px} .stepper b{min-width:28px;text-align:center;font-size:16px} .stepper .btn{width:30px;height:30px;padding:0;justify-content:center;font-size:16px}
tr.tot td{border-top:1.5px solid var(--ink)}
.nfgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.nf{display:flex;flex-direction:column;gap:8px;min-width:0}
.nf.wide{grid-column:1/-1} .nf.wide2{grid-column:span 2}
@media (max-width:760px){.nfgrid{grid-template-columns:minmax(0,1fr)} .nf.wide2{grid-column:auto}}
.fi{width:18px;height:18px;border-radius:99px;border:0;background:var(--quiet);color:var(--ink2);font:italic 800 11px/1 Georgia,serif;display:inline-flex;align-items:center;justify-content:center;vertical-align:1px;margin-left:4px;padding:0}
.fi:hover,.fi.on{background:var(--mark);color:var(--on-mark)}
.tipbox{margin:2px 0 8px;padding:10px 12px;border-radius:10px;background:var(--sunken);font-size:13px;color:var(--ink2);line-height:1.45}
.travel{margin:8px 0;padding:12px 14px;border-radius:12px;background:var(--good-bg);font-size:13px;line-height:1.45;color:var(--ink)}
.remote-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.remote{border:0;text-align:left;padding:22px 20px;display:flex;flex-direction:column;gap:4px;color:var(--ink);min-height:96px;justify-content:center}
.remote b{font-family:var(--f-display);font-size:22px}
.remote span{font-size:13px;color:var(--ink2)}
.remote.dark{background:var(--hero-bg);color:var(--hero-ink)} .remote.dark span{color:var(--hero-ink2)}
.remote:active{transform:scale(.98)}
@media (max-width:640px){.remote-grid{grid-template-columns:minmax(0,1fr)}}
.todo-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mini-prog{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--ink2)}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flab{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin:2px 0 -4px 2px}
/* to-do */
.td{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:14px;padding:14px 4px;border-top:1px solid var(--line)}
.td:first-child{border-top:0}
.chk{width:24px;height:24px;border-radius:99px;border:2px solid var(--ink4);background:none;flex:none;margin-top:1px;display:inline-flex;align-items:center;justify-content:center;color:var(--on-mark);font-size:13px;font-weight:900;padding:0}
.chk:hover{border-color:var(--ink2)}
.chk.on{background:var(--mark);border-color:var(--mark)}
.td .t{flex:1;min-width:0}
.td .t b{font-size:14.5px;font-weight:700;display:block}
.td.done .t b{text-decoration:line-through;color:var(--ink3);font-weight:600}
.td .t span{display:block;font-size:13px;color:var(--ink2);margin-top:2px}

    const sub = (rows, note) => rows.map(([n, v, flag]) => `<div class="sub-row" style="grid-template-columns:minmax(0,2.2fr) minmax(0,1.8fr) 110px 96px 116px"><span>${n}</span><div class="bar" style="margin:0;height:5px"><i style="width:${(v / rev * 100).toFixed(1)}%;background:var(--ink3)"></i></div><span class="r num">${money(v)}</span><span class="r num" style="color:var(--ink2)">${pc(v / rev * 100, 1)}</span><span class="r" style="font-size:12px;color:var(--bad);font-weight:700">${flag || ''}</span></div>`).join('') + (note ? `<p style="margin:8px 0 2px;padding-top:8px;border-top:1px solid var(--line);font-size:13px"><b>In plain words:</b> ${note}</p>` : '');
    const say = `This year we’ve kept <b>${Math.round(np / rev * 100)} cents of every dollar</b> after everything’s paid. Margin is ${K.gm.st.k === 'good' ? 'on track' : 'short'}${K.ovh.st.k === 'bad' ? `, but <span class="b">overheads are running high</span> at ${pc(K.ovh.v)}` : ''}.`;
    body = `<p class="say">${say}</p><section class="card pad"><div class="card-h"><div><b>The money, top to bottom</b><div style="font-size:14px;color:var(--ink2);margin-top:2px">Every figure is a share of what we invoiced.</div></div><button class="linkb" style="font-size:13px" data-go="numbers">Goals from Our numbers ›</button></div>
      <div class="tbl-wrap"><div style="min-width:720px"><div class="cols-h" style="${C}"><span></span><span></span><span></span><span class="r">$</span><span class="r">% of sales</span><span class="r">How it’s going</span></div>
      ${line('rev', 'Sales', 'everything we invoiced this financial year', rev, null, sub(fy.revSplit))}
      ${line('cogs', 'Cost of jobs', 'parts, gear, subbies and the techs’ time on the job', fy.cogs, null, sub(fy.cogsSplit, 'the direct cost of doing the work. It goes up and down with how much work we do.'))}
      ${line('gm', 'Gross margin', `aim for ${S.goals.gm}%+ · what’s left to run the business`, gm, K.gm.st)}
      ${line('ovh', 'Overheads', `aim for ${S.goals.ovh}% or less`, fy.ovh, K.ovh.st, sub(fy.ovhSplit, 'what it costs to keep the doors open, whether or not a job is on. Vans are the one to look at — 6.7% against a usual 5%.'))}
      ${line('np', 'Net profit', `aim for ${S.goals.np}%+ · what the business actually made`, np, K.np.st)}
      </div></div></section>`
      + plain([['Gross margin', `Out of every $100 we invoice, about $${Math.round(gm / rev * 100)} is left after parts and the techs’ time. That pays for everything else.`], ['Overheads', 'Rent, office wages, vans, insurance, software. They don’t stop when the work does.'], ['Net profit', 'What’s left at the very end. Our goal is 15 cents in every dollar.']]);
  } else {
    const xs = L.filter(x => x.grp === tab), name = KGROUPS.find(g => g[0] === tab)[1];
    const bad = xs.filter(x => x.st.k === 'bad'), good = xs.filter(x => x.st.k === 'good');
    const say = bad.length ? `${cap(name.toLowerCase())}: <span class="b">${bad.map(x => x.name.toLowerCase()).join(' and ')} ${bad.length > 1 ? 'need' : 'needs'} someone</span> — ${bad[0].f(bad[0].v)} against a goal of ${bad[0].gf(bad[0].goal)}.` : `${cap(name.toLowerCase())} ${good.length === xs.length ? 'is <span class="g">on track</span>' : 'is <b>close</b>'} across the board.`;
    const C = 'grid-template-columns:22px minmax(0,2.4fr) 120px 140px 104px 112px';
    const rows = xs.map(x => `<div class="dl"><div class="dl-h" style="${C}"><span></span><span class="dl-name"><b>${x.name}</b><span>${x.means}</span></span><span class="big r">${x.f(x.v)}</span><span class="r" style="color:var(--ink2)">${x.gf(x.goal)}</span>${spark(x.trend, x.st)}<span class="r">${pill(x.st)}</span></div></div>`).join('');
    xs.forEach(x => INFO.push([x.name, `${x.why} ${x.todo}`]));
    body = `<p class="say">${say}</p><section class="card pad"><div class="card-h"><div><b>${name} KPIs</b><div style="font-size:14px;color:var(--ink2);margin-top:2px">This month against the goals in Our numbers.</div></div><button class="linkb" style="font-size:13px" data-go="numbers">Change the goals in Our numbers ›</button></div>
      <div class="tbl-wrap"><div style="min-width:720px"><div class="cols-h" style="${C}"><span></span><span>KPI · what it means</span><span class="r">This month</span><span class="r">Goal</span><span>6 months</span><span class="r">How it’s going</span></div>${rows}</div></div></section>`;
  }
  return head('Our KPIs', tab === 'overview' ? 'This financial year so far · from Xero' : 'October so far · ServiceTitan and Xero') + tabs('kpis', tl) + body;
}

/* ---------- Profit & finance › Overview ---------- */
function chartNP() {
  const W = 760, H = 260, L = 48, R = 12, T = 18, B = 28, v = A.np12, n = 12, goals = A.m12.map((m, i) => { const gi = MONTHS_FY.indexOf(m); let g = S.goals.months[gi] * S.goals.np / 100; if (i === 11) g *= A.wd / A.wdMonth; return g; });
  const hi = Math.ceil(Math.max(...v, ...goals) * 1.15 / 4) * 4, bw = (W - L - R) / n, Y = x => T + (H - T - B) * (1 - x / hi);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Net profit by month against the monthly goal">`;
  [0, hi / 2, hi].forEach(t => { s += `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="12" fill="var(--ink3)">$${t}K</text>`; });
  v.forEach((x, i) => {
    const x0 = L + i * bw + bw * .2, hit = x >= goals[i], last = i === 11;
    s += `<rect x="${x0}" y="${Y(x)}" width="${bw * .6}" height="${Y(0) - Y(x)}" rx="5" fill="${hit ? 'var(--good-f)' : 'var(--ink4)'}" ${last ? 'fill-opacity=".55" stroke="var(--ink3)" stroke-dasharray="4 3"' : ''}><title>${A.m12[i]}: ${money(x * 1000)} · goal ${money(goals[i] * 1000)}</title></rect>`;

const vKm = v => v.kms.length ? v.kms[0][1] : 0;
function vWeekly(v) {
  const w = v.weeks.find(x => x.wk === WK0), n = w ? sum(w.items) : 0;
  if (!v.weeks.length) return { k: 'bad', w: 'Never done', s: 'No weekly check recorded', n: 0 };
  if (!w) return { k: 'bad', w: 'Overdue', s: `Due Monday by 8am · last one ${v.weeks[0].when.split(' ')[0]} ${shortD(v.weeks[0].wk)}`, n: 0 };
  if (n < CHECKS.length) return { k: 'mid', w: `${n} of ${CHECKS.length}`, s: `Started ${w.when} · ${w.photos} of 6 photos`, n };

}
function vService(v) {
  const open = v.issues.filter(i => i.st !== 'Fixed').length;
  if (!v.every) return { k: 'none', w: 'Not set', s: 'Set a service interval', left: null, open };
  const left = v.lastSvc + v.every - vKm(v);
  if (!vKm(v)) return { k: 'none', w: 'Waiting on km', s: `Every ${kmf(v.every)} · log a reading first`, left, open };
  if (left < 0) return { k: 'bad', w: 'Overdue', s: `${kmf(-left)} past the service`, left, open };
  if (left < 2000) return { k: 'mid', w: 'Due soon', s: `${kmf(left)} to next service`, left, open };
  if (open) return { k: 'mid', w: `${open} request${open > 1 ? 's' : ''}`, s: `${kmf(left)} to next service`, left, open };

function vKmSt(v) {

  if (age <= 6) return { k: 'good', w: kmf(v.kms[0][1]), s: age ? `${age} days ago` : 'Today' };
  return { k: age > 14 ? 'bad' : 'mid', w: 'Missing this week', s: `Last ${kmf(v.kms[0][1])} · ${shortD(v.kms[0][0])}` };

function crewCounts() {
  const lics = CREW.people.flatMap(p => p.lic);

  const when = [['Weekdays 7am to 4pm', scl(22)], ['Weekday evenings', scl(5)], ['Weekends', scl(3)]];
  const pages = [['Get a quote', scl(21)], ['Heat pump hot water', scl(5)], ['Contact', scl(4)]];

function pageMktSite() {

  return `<p class="say"><b>${scl(1240).toLocaleString('en-AU')} visits</b> in the last ${per()[0]}. People read the price and rebate pages longest, and <b>Pricing is where a third of them leave.</b></p>`

    + `<section class="card pad"><div class="card-h"><b>Time on each page</b><span>average time a visit spends on the page</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Page</th><th>Views</th><th>Avg time</th><th>Left from here</th></tr></thead><tbody>${P.map(p => `<tr><td><b>${p[0]}</b></td><td>${scl(p[1]).toLocaleString('en-AU')}</td><td>${t(p[2])}</td><td>${p[3] >= 30 ? `<span style="color:var(--bad);font-weight:700">${p[3]}%</span>` : p[3] + '%'}</td></tr>`).join('')}</tbody></table></div></section>`
    + `<section class="card pad"><div class="card-h"><b>Button presses</b><span>every tracked button, and how many went on to enquire</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Button</th><th style="text-align:left">Where it sits</th><th>Presses</th><th>Then enquired</th></tr></thead><tbody>${B.map(b => `<tr><td><b>${b[0]}</b></td><td style="text-align:left">${b[1]}</td><td>${scl(b[2])}</td><td>${b[3]}%</td></tr>`).join('')}</tbody></table></div></section>`
    + plain([['Avg time', 'Only counts while the page is open in front of someone, not a tab left sitting in the background.'], ['Left from here', 'The share of visits that closed the site on this page. High on Pricing usually means the price surprised them, or the next step wasn’t clear.'], ['Then enquired', 'Pressed the button and went on to send a quote or tap the number.']]);
}

function pageMktDrop() {
  const S0 = [['Landed on the site', 'any page', 1240], ['Looked at a service or price page', 'heat pumps, splits, ducted, pricing, VEU', 610], ['Opened the quote form', 'home card or the quote page', 214], ['Step 1 · What do you need?', 'picked a system', 128], ['Step 2 · Where are you?', 'suburb and property type', 84], ['Step 3 · How do we reach you?', 'name, phone, email', 52], ['Sent the quote', 'landed in the inbox', 30]];
  let worst = 1, wl = 0; S0.forEach((s, i) => { if (i) { const l = 1 - s[2] / S0[i - 1][2]; if (l > wl) { wl = l; worst = i; } } });
  const exits = [['Pricing', 'after looking at the price table', 55], ['Get a quote · step 2', 'the suburb question', 44], ['Home', 'didn’t scroll past the top', 420], ['Heat pump hot water', 'read most of it, then left', 85]];
  return `<p class="say"><b>${scl(30)} of ${scl(1240).toLocaleString('en-AU')} visits</b> ended with a quote request. <b style="color:var(--bad)">The biggest drop is at “${S0[worst][0]}”</b>: ${Math.round(wl * 100)}% stop there.</p>`
    + `<section class="card pad"><div class="card-h"><b>The quote journey</b><span>visits that reached each step</span></div>${S0.map((s, i) => { const loss = i ? 1 - s[2] / S0[i - 1][2] : 0; return `${i ? `<div class="drop-loss ${i === worst ? 'bad' : ''}">↓ ${scl(S0[i - 1][2] - s[2]).toLocaleString('en-AU')} stopped here · ${Math.round(loss * 100)}%${i === worst ? ' · the biggest drop' : ''}</div>` : ''}<div class="hbar"><span class="t">${esc(s[0])}<span>${esc(s[1])}</span></span><span class="track"><i class="${i === S0.length - 1 ? 'good' : ''}" style="width:${s[2] / S0[0][2] * 100}%"></i></span><b>${scl(s[2]).toLocaleString('en-AU')}</b><span class="ks pc">${Math.round(s[2] / S0[0][2] * 100)}%</span></div>`; }).join('')}</section>`
    + `<section class="card pad"><div class="card-h"><b>Pages they leave from</b><span>the last page before they closed the site</span></div>${exits.map(e => `<div class="kv"><span class="t"><b>${e[0]}</b><span>${e[1]}</span></span><span class="v">${scl(e[2])}</span></div>`).join('')}</section>`
    + plain([['The quote journey', 'Every step from landing on the site to sending a quote. Fix the biggest drop first; it’s where the most people are lost.'], ['Step 1 to 3', 'The questions on the quote form. Fewer questions, or asking the easy ones first, usually lifts the number that finish.'], ['Pages they leave from', 'Not always bad: someone who reads the price and rings you won’t show as an enquiry here.']]);
}

function pageMktCamp() {

    + segOf(['All', ...AUD].map(a => [a, a, a === 'All' ? '' : MKT.camps.filter(c => c.aud === a).length || '']), f, 'mcf')
    + `<section class="card pad"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Campaign</th><th style="text-align:left">Where</th><th style="text-align:left">For</th><th style="text-align:left">Status</th><th>Monthly</th><th>Leads</th><th>Cost a lead</th><th style="text-align:left">Owner</th></tr></thead><tbody>${list.map(c => `<tr><td><b>${esc(c.name)}</b><div class="ks">${esc(c.det)}</div></td><td style="text-align:left">${esc(c.where)}</td><td style="text-align:left"><span class="chip">${esc(c.aud)}</span></td><td style="text-align:left"><select class="inp st-${stK[c.st] || 'none'}" data-mcst="${c.id}" aria-label="Status of ${esc(c.name)}">${opts(['Draft', 'In progress', 'Running', 'Always on', 'Paused', 'Finished'], c.st)}</select></td><td>${c.spend ? money(c.spend) : '·'}</td><td>${c.leads || '·'}</td><td>${c.spend && c.leads ? money(c.spend / c.leads) : '·'}</td><td style="text-align:left">${esc(c.owner)}</td></tr>`).join('') || '<tr><td colspan="8">Nothing for this group yet.</td></tr>'}</tbody></table></div></section>`
    + plain([['Campaign', 'Anything we do to bring in work or people: ads, the website, talks to agents, asking for reviews.'], ['Cost a lead', 'Monthly spend divided by the leads it brought in. Under $80 is good for our jobs; an average job is worth well over that.'], ['Always on', 'Never switched off: the website and asking for reviews.']]);

  if (d.rtog) { const r2 = W.reports.find(x => x.k === d.rtog); r2.on = !r2.on; saveW(); render(); return; }
  if (d.rpreview !== undefined && 'rpreview' in d) { ui.rprev = d.rpreview || null; render(); return; }
  if (d.stdadd) { W.std.push(['New job', 2, 'svc']); saveW(); render(); return; }
  if (d.stddel) { W.std.splice(+d.stddel, 1); saveW(); render(); return; }
  /* wall board */
  if (d.line) { ui.line = +d.line; ui.tvIdx = 0; ui.screen = 0; render(); return; }
  if (d.alert) { W.alerts[d.alert] = !W.alerts[d.alert]; saveW(); render(); return; }
  if (d.tv) { const n = curLine().screens.length; if (d.tv === 'play') ui.playing = !ui.playing; else { ui.tvIdx = (ui.tvIdx + (d.tv === 'next' ? 1 : -1) + n) % n; tick = 0; } render(); return; }
  if (d.tvgo) { ui.tvIdx = +d.tvgo; tick = 0; render(); return; }
  if (d.tvfull) { openTV(d.tvfull === 'build' ? ui.screen : ui.tvIdx); return; }
  if (d.tvclose) { closeTV(); return; }
  if (d.msg) { showMsg = d.msg === 'show' ? (document.getElementById('msgIn').value || '').trim() : ''; render(); if (showMsg) toast('Showing on the TV'); return; }
  if (d.bline) { ui.line = +d.bline; ui.screen = 0; ui.sel = null; render(); return; }
  if (d.scr) { ui.screen = +d.scr; ui.sel = null; render(); return; }
  if (d.scrmove) { const [i, dir] = d.scrmove.split(':').map(Number), s = curLine().screens, j = i + dir; if (j < 0 || j >= s.length) return; [s[i], s[j]] = [s[j], s[i]]; ui.screen = j; saveW(); render(); return; }
  if (d.scradd) { const s = curLine().screens; s.push({ name: 'New screen', tiles: [clone(st0)] }); ui.screen = s.length - 1; ui.sel = null; saveW(); render(); return; }
  if (d.scrdel) { const s = curLine().screens; if (s.length < 2) return; s.splice(ui.screen, 1); ui.screen = Math.max(0, ui.screen - 1); ui.sel = null; saveW(); render(); return; }
  if (d.add) {
    const scr = curScreen(), [, , , w, h] = TILE_TYPES[d.add]; let placed = null;
    for (const [tw, th] of [[w, h], [Math.min(w, 6), h], [3, Math.min(h, 2)], [3, 1]]) { for (let y = 0; y <= 6 - th && !placed; y++) for (let x = 0; x <= 12 - tw && !placed; x++) { const t = { t: d.add, x, y, w: tw, h: th }; if (fits(scr, t, -1)) placed = t; } if (placed) break; }
    if (!placed) { toast('No room on this screen. Make a tile smaller or remove one first.'); return; }
    if (d.add === 'number') placed.m = 'soldMonth'; if (d.add === 'message') placed.text = 'Type a message';
    scr.tiles.push(placed); ui.sel = scr.tiles.length - 1; saveW(); render(); return;
  }
  if (d.tdel) { const scr = curScreen(); scr.tiles.splice(ui.sel, 1); ui.sel = null; saveW(); render(); return; }
});
document.addEventListener('input', e => {
  const d = e.target.dataset;
  if (d.pvol) { const p = W.pops.find(x => x.k === d.pvol); p.vol = +e.target.value; ui.sdirty = true; const lab = e.target.parentElement.querySelector('b'); if (lab) lab.textContent = p.vol + '%'; const sv = document.querySelector('[data-psave]'); if (sv) sv.disabled = false; }
});
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (d.bind) { if (setPath(d.bind, el.value, d.label)) { render(); const again = document.getElementById(el.id); if (again) again.focus({ preventScroll: true }); } return; }
  if (d.tset) {
    const scr = curScreen(), t = scr.tiles[ui.sel]; if (!t) return;
    if (d.tset === 'w' || d.tset === 'h') { const nt = { ...t, [d.tset]: +el.value }; if (!fits(scr, nt, ui.sel)) { toast('That size won’t fit there. Move the tile or make room first.'); render(); return; } Object.assign(t, nt); }
    else t[d.tset] = el.value;
    saveW(); render(); return;
  }
  if (d.cfield) { const [id, f] = d.cfield.split(':'), c = T.contacts.find(x => x.id === id); c[f] = f === 'every' ? +el.value : (['role', 'company', 'looks', 'decides', 'history', 'matters', 'phone', 'email', 'address'].includes(f) ? el.value.trim() : (el.value.trim() || c[f])); saveT(); render(); return; }
  if (d.ifield) { const [id, f] = d.ifield.split(':'), i = T.ideas.find(x => x.id === id); i[f] = el.value.trim() || i[f]; saveT(); render(); return; }
  if (d.jsel) { ui[d.jsel] = el.value; render(); return; }
  if (d.qstat) { const q = QALL.find(x => x.id === d.qstat); q.status = el.value; if (el.value === 'Followed up') q.age = 0; store(QKEY, QALL); render(); toast(`${q.who}: ${el.value}. Sent to ServiceTitan (sample, not connected)`); return; }
  if (d.setbiz) { SET.biz[d.setbiz] = d.setbiz === 'name2' ? el.value.trim() : (el.value.trim() || SET.biz[d.setbiz]); if (d.setbiz === 'short') SET.biz.short = SET.biz.short.slice(0, 3).toUpperCase(); saveSet(); render(); document.title = SET.biz.short + ' Team Portal'; return; }
  if (d.setstate) { const st = STATES[el.value]; S.biz.state = el.value; S.biz.publicHols = st.ph; S.log.unshift({ what: 'State', from: '', to: st.name, when: 'Today' }); saveS(); render(); toast(`Set to ${st.name}: ${st.ph} public holidays, payroll tax over ${money(st.thr)}`); return; }
  if (d.ordst) { const o = CREW.orders.find(x => x.id === d.ordst); o.st = el.value; saveC(); render(); return; }
  if (d.psnd) { const p = W.pops.find(x => x.k === d.psnd); p.sound = el.value; ui.sdirty = true; render(); playSound(p.sound, p.vol); return; }
  if (d.wtteam) { W.targets.team = +el.value || W.targets.team; saveW(); render(); return; }
  if (d.stdname) { W.std[+d.stdname][0] = el.value.trim() || W.std[+d.stdname][0]; saveW(); return; }
  if (d.stdtype) { W.std[+d.stdtype][2] = el.value; saveW(); return; }
  if (d.stdhrs) { W.std[+d.stdhrs][1] = +el.value || W.std[+d.stdhrs][1]; saveW(); return; }
  if (d.setstart) { SET.start = el.value; saveSet(); toast('The portal will open on ' + el.options[el.selectedIndex].text); return; }
  if (el.id === 'tdDue') { document.getElementById('tdDate').hidden = el.value !== 'pick'; return; }
  if (d.scrname) { curScreen().name = el.value.trim() || 'Screen'; saveW(); render(); return; }
  if (d.linesecs) { curLine().secs = clamp(+el.value || 20, 5, 120); saveW(); render(); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input[data-bind], input[data-scrname], input[data-linesecs], input[data-tset], input[data-cfield], input[data-ifield]')) e.target.blur();
  if (e.key === 'Enter' && e.target.id === 'tdTitle') addTask();
  if (e.key === 'Enter' && e.target.id === 'idTitle') addIdea();
  if (e.key === 'Enter' && e.target.id === 'te-title') saveTask(ui.editTask);
  if (e.key === 'Enter' && e.target.id === 'cn-text') document.querySelector('[data-cnote]')?.click();
  if (e.key === 'Enter' && (e.target.id === 'kcName' || e.target.id === 'kcPlace')) addContact();
  if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('is-')) document.querySelector(`[data-isadd="${e.target.id.slice(3)}"]`)?.click();
  if (e.key === 'Escape' && ui.editTask) { ui.editTask = null; render(); }
  if (e.key === 'Escape') closeTV();
});
document.getElementById('themeBtn').addEventListener('click', () => { const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (SET.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches); SET.theme = dark ? 'light' : 'dark'; saveSet(); applySettings(); if (route === 'settings') render(); });
document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('side').classList.toggle('open'));

function addTask() {
  const ti = document.getElementById('tdTitle'), v = (ti.value || '').trim(); if (!v) { ti.focus(); toast('Type what needs doing first'); return; }
  const dEl = document.getElementById('tdDue'), dsel = dEl ? dEl.value : '0', due = dsel === 'pick' ? (document.getElementById('tdDate').value || TODAY) : addDays(TODAY, +dsel);
  T.tasks.push({ id: 't' + Date.now(), title: v, note: (document.getElementById('tdNote')?.value || '').trim(), who: document.getElementById('tdWho')?.value || 'Jake', due });
  saveT(); render(); toast('Added for ' + (['Today', 'Tomorrow'].includes(dueWords(due)) ? dueWords(due).toLowerCase() : dueWords(due))); const n = document.getElementById('tdTitle'); if (n) n.focus();
}
function saveTask(id) {
  const t = T.tasks.find(x => x.id === id); if (!t) return;
  const v = (document.getElementById('te-title').value || '').trim(); if (!v) { toast('A to-do needs a name'); return; }
  t.title = v; t.note = (document.getElementById('te-note').value || '').trim(); t.who = document.getElementById('te-who').value; t.due = document.getElementById('te-due').value || t.due;
  ui.editTask = null; saveT(); render(); toast('Saved');
}
async function uploadSound() {
  const f = document.getElementById('upFile').files[0], name = (document.getElementById('upName').value || '').trim();
  if (!f) { toast('Choose an MP3 first'); return; }
  if (f.size > 3 * 1024 * 1024) { toast('That file is over 3 MB. Use a shorter clip'); return; }
  const buf = await f.arrayBuffer(), u = { id: 's' + Date.now(), name: name || f.name.replace(/\.[^.]+$/, ''), size: f.size, when: fmtDay(TODAY), buf };
  UPLOADS.push(u); idbPut(u); render(); toast(`${u.name} uploaded. Pick it for a pop-up above`);
}
function saveNewContact() {
  const g = id => (document.getElementById(id)?.value || '').trim(), name = g('nc-name');
  if (!name) { document.getElementById('nc-name').focus(); toast('Add a name first'); return; }
  const c = { id: 'c' + Date.now(), name, phone: g('nc-phone'), email: g('nc-email'), address: g('nc-address'), place: g('nc-place') || '—', type: g('nc-type'), grp: g('nc-grp'), how: g('nc-how'), every: +g('nc-every') || 30,
    why: g('nc-why') || 'Say hello', last: TODAY, notes: [{ d: TODAY, k: 'Note', t: g('nc-note') || 'Added to Keep in touch' }], jobs: [], kit: g('nc-kit') ? [[g('nc-kit'), '']] : [], quotes: [], role: g('nc-role'), company: g('nc-company'), looks: g('nc-looks'), decides: g('nc-decides'), history: g('nc-history'), matters: g('nc-matters') };
  T.contacts.push(c); ui.contact = c.id; saveT(); render(); window.scrollTo(0, 0); toast('Profile saved');
}
function addContact() {
  const n = document.getElementById('kcName'), v = (n.value || '').trim(); if (!v) { n.focus(); toast('Add a name first'); return; }
  const c = { id: 'c' + Date.now(), grp: document.getElementById('kcGrp').value, type: document.getElementById('kcType').value, name: v, place: (document.getElementById('kcPlace').value || '').trim() || '—', why: 'Say hello', last: TODAY, every: 30, how: 'Call', notes: [{ d: TODAY, k: 'Note', t: 'Added to Keep in touch' }], jobs: [], kit: [], quotes: [] };
  T.contacts.push(c); ui.addContact = false; ui.contact = c.id; saveT(); render(); window.scrollTo(0, 0);
}
function addIdea() {
  const ti = document.getElementById('idTitle'), v = (ti.value || '').trim(); if (!v) { ti.focus(); toast('Give the idea a name first'); return; }
  const i = { id: 'i' + Date.now(), title: v, why: (document.getElementById('idWhy').value || '').trim() || 'Add why it’s worth doing.', who: document.getElementById('idWho').value, impact: document.getElementById('idImpact').value, effort: document.getElementById('idEffort').value, stage: 'Idea', votes: 1, steps: [] };
  T.ideas.push(i); ui.addIdea = false; ui.voted = ui.voted || {}; ui.voted[i.id] = 1; saveT(); render(); toast(quickWin(i) ? 'Added — and it’s a quick win' : 'Idea added');
}
/* drag tiles in the builder */
function bindDrag() {
  const wrap = document.getElementById('buildStage'); if (!wrap) return;
  wrap.querySelectorAll('.tt.edit').forEach(node => {
    node.addEventListener('pointerdown', ev => {
      const i = +node.dataset.ti, scr = curScreen(), t = scr.tiles[i];
      if (ui.sel !== i) { ui.sel = i; render(); return; }
      ev.preventDefault(); node.setPointerCapture(ev.pointerId);
      const scale = wrap.clientWidth / 1600, sx = ev.clientX, sy = ev.clientY, ox = t.x, oy = t.y;
      const move = mv => {
        const nx = ox + Math.round((mv.clientX - sx) / scale / (G.cw + 16)), ny = oy + Math.round((mv.clientY - sy) / scale / (G.rh + 16));
        const nt = { ...t, x: nx, y: ny };
        if ((nx !== t.x || ny !== t.y) && fits(scr, nt, i)) { t.x = nx; t.y = ny; node.style.left = gx(nx) + 'px'; node.style.top = gy(ny) + 'px'; }
      };
      const up = () => { node.removeEventListener('pointermove', move); node.removeEventListener('pointerup', up); node.removeEventListener('pointercancel', up); saveW(); };
      node.addEventListener('pointermove', move); node.addEventListener('pointerup', up); node.addEventListener('pointercancel', up);
    });
  });
}

/* the TV: full view and the play timer */
let tvOpen = false, tvIdx = 0, tick = 0;
function drawTV() {
  const l = curLine(), scr = l.screens[tvIdx % l.screens.length];
  document.getElementById('tvRoot').innerHTML = `<div class="tv-full" role="dialog" aria-label="TV view"><div class="tv-bar"><span>${esc(l.name)} · ${esc(scr.name)} · screen ${(tvIdx % l.screens.length) + 1} of ${l.screens.length}</span><button class="btn sm" style="margin-left:auto" data-tvclose="1">Close TV view</button></div>${stageHTML(scr, false, 'tvStage')}</div>`;
  const w = document.getElementById('tvStage'), s = w.querySelector('.stage'), sc = Math.min(w.clientWidth / 1600, w.clientHeight / 900);
  s.style.transform = `translate(${(w.clientWidth - 1600 * sc) / 2}px,${(w.clientHeight - 900 * sc) / 2}px) scale(${sc})`;
}
function openTV(i) { tvOpen = true; tvIdx = i; tick = 0; drawTV(); }
function closeTV() { if (!tvOpen) return; tvOpen = false; document.getElementById('tvRoot').innerHTML = ''; }
setInterval(() => {
  const l = curLine(); tick++;
  if (tick < l.secs) return; tick = 0;
  if (tvOpen) { tvIdx = (tvIdx + 1) % l.screens.length; drawTV(); }
  if (route === 'wall' && ui.playing && !document.activeElement?.matches('input')) {
    ui.tvIdx = (ui.tvIdx + 1) % l.screens.length;
    const box = document.getElementById('wallStageBox'), cnt = document.getElementById('tvCount');
    if (box) { render(); }
  }
}, 1000);
window.addEventListener('resize', () => { scaleStages(); if (tvOpen) drawTV(); });

window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== route && findRoute(h)) go(h); });
/* start */
applySettings();
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySettings); } catch (e) {}
const h0 = (location.hash || '').slice(1);
if (h0 && findRoute(h0)) route = h0; else if (findRoute(SET.start)) route = SET.start;
render();
})();
