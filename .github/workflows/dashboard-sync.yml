name: Dashboard sync

# Drives the wall dashboard's /api/sync endpoint.
#
# This lives here rather than in vercel.json because Vercel's Hobby plan only
# permits daily cron jobs — a deploy carrying "*/10 * * * *" is rejected
# outright, and a once-a-day sync would make a "live" board a day stale.
#
# On a Vercel Pro plan this file can be deleted and the schedule moved back into
# vercel.json, which is the more reliable option:
#   { "crons": [{ "path": "/api/sync", "schedule": "*/10 * * * *" }] }

on:
  schedule:
    # Every 10 minutes (UTC). GitHub's scheduler is best-effort: runs can be
    # delayed by several minutes at peak, and scheduled workflows are disabled
    # automatically after 60 days without repository activity.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      reset:
        description: "Discard stored ServiceTitan continuation tokens and re-export from the beginning"
        type: boolean
        default: false

concurrency:
  # A slow backfill must not have the next tick running on top of it.
  group: dashboard-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger sync
        env:
          SYNC_URL: ${{ secrets.DASHBOARD_SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESET: ${{ inputs.reset && '1' || '' }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::DASHBOARD_SYNC_URL and CRON_SECRET repository secrets must both be set."
            exit 1
          fi

          # Trim surrounding whitespace. A secret pasted with a leading space
          # is invisible in the GitHub UI and fails as "curl: (3) URL rejected:
          # Malformed input to a URL function", which names nothing useful —
          # it already cost one confusing red run.
          url="$(printf '%s' "$SYNC_URL" | tr -d '[:space:]')"

          case "$url" in
            https://*|http://*) ;;
            *)
              echo "::error::DASHBOARD_SYNC_URL does not look like a URL. Expected something like https://www.advancedgas.com.au/api/sync"
              exit 1
              ;;
          esac

          if [ -n "$RESET" ]; then
            url="${url}?reset=1"
          fi

          # --fail-with-body so a non-2xx still prints the API's own error before
          # the step fails; the response names which sync leg broke.
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$url"
