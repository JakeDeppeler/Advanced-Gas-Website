name: ServiceTitan locations import

# Creates the locations listed in portal_settings.st_location_import under one
# ServiceTitan customer. The list is kept in Supabase rather than here because
# this repo and its Actions logs are public and the list holds contact details.
#
# Actions tab → ServiceTitan locations import → Run workflow, then pick a task:
#   dry-run   shows the customer and what would be created. Writes nothing.
#   create    creates everything still missing, `limit` per call, stopping at the
#             first failure. Safe to repeat: names already on the customer, or
#             already created by this import, are skipped.
#   contacts  adds any missing contact. Run after create — ServiceTitan takes a
#             little while to make a new location readable.
#   notes     adds each location's notes (repairs from the service list), pinned.
#   others    read-only: the customer's locations that are not on the list, and
#             which listed unit each appears to duplicate. The full report is
#             saved to portal_settings.st_location_import_others, not this log,
#             because existing location names can carry residents' names.
#   merge     folds the duplicate pairs a person approved (listed in
#             portal_settings.st_location_import_merge): the older record is
#             kept and renamed, the newer one deactivated. Safe to repeat.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to do"
        type: choice
        options: [dry-run, create, contacts, notes, others, merge]
        default: dry-run
      limit:
        description: "Locations per call (max 50)"
        type: string
        default: "50"
      url:
        description: "Site to run against (default: the DASHBOARD_SYNC_URL host)"
        type: string
        required: false

concurrency:
  group: servicetitan-locations
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run the selected task
        env:
          SYNC_URL: ${{ secrets.DASHBOARD_SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TASK: ${{ inputs.task }}
          LIMIT: ${{ inputs.limit || '50' }}
          URL_OVERRIDE: ${{ inputs.url }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Set the DASHBOARD_SYNC_URL and CRON_SECRET repository secrets first."
            exit 1
          fi
          SYNC_URL="$(printf '%s' "$SYNC_URL" | tr -d '[:space:]')"
          BASE="${URL_OVERRIDE:-${SYNC_URL%/api/sync}}"
          BASE="${BASE%/}/api/servicetitan/locations"
          auth=(-H "Authorization: Bearer ${CRON_SECRET}")
          JQ_DEFS='def e: (if . == null then "" else . end) | tostring | gsub("\\|"; "/");'

          # One call. Prints the response and fails the step on an error body.
          call() {
            curl -sS --max-time 90 "${auth[@]}" "${BASE}$1" > run.json || true
            jq -c 'del(.summary)' run.json || cat run.json
            if [ "$(jq -r '.mode // empty' run.json 2>/dev/null)" = "" ]; then
              echo "::error::$(jq -r '.error // "unexpected response"' run.json 2>/dev/null || echo unexpected response)"
              exit 1
            fi
          }
          customer() { jq -r '"\(.summary.customer.name) (\(.summary.customer.id))"' run.json; }
          failure_table() {
            if [ -s failures.ndjson ]; then
              echo
              echo "| Location | Id | Error |"
              echo "|---|---|---|"
              jq -r "${JQ_DEFS}"'"| \(.name|e) | \(.id|e) | \(.error|e) |"' failures.ndjson
            fi
          }
          : > failures.ndjson

          case "$TASK" in
            dry-run)
              call ""
              {
                echo "## Locations import — dry run (nothing written)"
                echo
                jq -r '"Customer **\(.summary.customer.name)** (\(.summary.customer.id)) has \(.summary.existingOnCustomer) locations now."' run.json
                echo
                jq -r '"In the list: \(.summary.inList). Already on the customer: \(.summary.alreadyThere). To create: **\(.summary.toCreate)**."' run.json
              } >> "$GITHUB_STEP_SUMMARY"
              ;;

            create)
              total=0; rounds=0
              while :; do
                rounds=$((rounds + 1))
                call "?apply=1&limit=${LIMIT}"
                total=$((total + $(jq -r .created run.json)))
                jq -c '.failed[]' run.json >> failures.ndjson
                remaining=$(jq -r .remaining run.json)
                # Stop on any failure so a systematic error costs one batch.
                if [ -s failures.ndjson ] || [ "$remaining" = "0" ] || [ "$rounds" -ge 40 ]; then break; fi
              done
              {
                echo "## Locations import — create"
                echo
                echo "Customer **$(customer)**. Created **${total}**, failed **$(wc -l < failures.ndjson)**, still to create **${remaining}**."
                failure_table
              } >> "$GITHUB_STEP_SUMMARY"
              ;;

            contacts)
              from=0; checked=0; added=0
              while :; do
                call "?contacts=1&from=${from}&limit=${LIMIT}"
                checked=$((checked + $(jq -r .checked run.json)))
                added=$((added + $(jq -r .added run.json)))
                jq -c '.failed[]' run.json >> failures.ndjson
                from=$(jq -r '.next // empty' run.json)
                [ -z "$from" ] && break
              done
              {
                echo "## Locations import — contacts"
                echo
                echo "Checked **${checked}** locations, added **${added}** missing contacts, failed **$(wc -l < failures.ndjson)**."
                failure_table
              } >> "$GITHUB_STEP_SUMMARY"
              ;;

            notes)
              call "?notes=1"
              jq -c '.failed[]' run.json >> failures.ndjson
              {
                echo "## Locations import — notes"
                echo
                jq -r '"\(.locations) locations have notes on the list. Added **\(.added)** notes, failed **\(.failed | length)**."' run.json
                failure_table
              } >> "$GITHUB_STEP_SUMMARY"
              ;;

            others)
              call "?others=1"
              {
                echo "## Locations import — other locations on the customer"
                echo
                jq -r '"**\(.others)** locations on the customer are not on the import list; **\(.sameUnitAsListed)** of them look like the same unit as an imported one. Full report saved to `\(.savedTo)` (kept out of this public log)."' run.json
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            merge)
              call "?merge=1"
              jq -c '.results[] | select(.ok | not)' run.json >> failures.ndjson
              {
                echo "## Locations import — merge duplicates"
                echo
                jq -r '"Merged **\(.merged)** of \(.pairs) approved pairs."' run.json
                echo
                echo "| Unit | Kept | Deactivated | Done | Error |"
                echo "|---|---|---|---|---|"
                jq -r "${JQ_DEFS}"'.results[] | "| \(.name|e) | \(.keep|e) | \(.retire|e) | \((.done // []) | join(", ")|e) | \(.error|e) |"' run.json
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

          [ ! -s failures.ndjson ]
