name: ServiceTitan locations import

# Creates the locations listed in portal_settings.st_location_import under one
# ServiceTitan customer. The list is kept in Supabase rather than here because
# this repo and its Actions logs are public and the list holds contact details.
#
# Actions tab → ServiceTitan locations import → Run workflow.
#   - Untick "apply" for a dry run: shows the customer name and what would be
#     created. Nothing is written.
#   - Tick "apply" with a small limit for a test batch, check it in ServiceTitan,
#     then tick "all" to create the rest. Re-running is safe: locations that
#     already exist on the customer (by name) are skipped.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Create locations in ServiceTitan"
        type: boolean
        default: false
      limit:
        description: "Locations per call (max 50)"
        type: string
        default: "5"
      all:
        description: "Keep calling until every location is created (apply only)"
        type: boolean
        default: false
      url:
        description: "Site to run against (default: the DASHBOARD_SYNC_URL host)"
        type: string
        required: false

concurrency:
  group: servicetitan-locations
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Plan or create locations
        env:
          SYNC_URL: ${{ secrets.DASHBOARD_SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APPLY: ${{ inputs.apply && '1' || '' }}
          ALL: ${{ inputs.all && '1' || '' }}
          LIMIT: ${{ inputs.limit || '5' }}
          URL_OVERRIDE: ${{ inputs.url }}
        run: |
          set -euo pipefail

          if [ -z "${SYNC_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Set the DASHBOARD_SYNC_URL and CRON_SECRET repository secrets first."
            exit 1
          fi
          SYNC_URL="$(printf '%s' "$SYNC_URL" | tr -d '[:space:]')"
          BASE="${URL_OVERRIDE:-${SYNC_URL%/api/sync}}"
          BASE="${BASE%/}"
          auth=(-H "Authorization: Bearer ${CRON_SECRET}")
          JQ_DEFS='def e: (if . == null then "" else . end) | tostring | gsub("\\|"; "/");'

          if [ -z "$APPLY" ]; then
            curl --fail-with-body -sS --max-time 90 "${auth[@]}" "${BASE}/api/servicetitan/locations" > plan.json || { cat plan.json; exit 1; }
            {
              echo "## Locations import — dry run (nothing written)"
              echo
              jq -r '"Customer **\(.summary.customer.name)** (\(.summary.customer.id)) has \(.summary.existingOnCustomer) locations now."' plan.json
              echo
              jq -r '"In the list: \(.summary.inList). Already on the customer: \(.summary.alreadyThere). To create: **\(.summary.toCreate)**."' plan.json
              echo
              echo "First to create: $(jq -r '.firstToCreate | join(", ")' plan.json)"
            } >> "$GITHUB_STEP_SUMMARY"
            jq . plan.json
            exit 0
          fi

          total=0; failed=0; rounds=0
          : > failures.ndjson
          while :; do
            rounds=$((rounds + 1))
            curl -sS --max-time 90 "${auth[@]}" "${BASE}/api/servicetitan/locations?apply=1&limit=${LIMIT}" > run.json || true
            jq -c '{ok, mode, summary, created, remaining, createdNames, failed, error}' run.json || cat run.json
            if [ "$(jq -r '.mode // empty' run.json)" != "apply" ]; then
              echo "::error::$(jq -r '.error // "unexpected response"' run.json 2>/dev/null || echo unexpected response)"
              exit 1
            fi
            total=$((total + $(jq -r .created run.json)))
            n=$(jq -r '.failed | length' run.json)
            failed=$((failed + n))
            jq -c '.failed[]' run.json >> failures.ndjson
            remaining=$(jq -r .remaining run.json)
            customer=$(jq -r '"\(.summary.customer.name) (\(.summary.customer.id))"' run.json)
            # Stop on any failure so a systematic error (a missing scope, a bad
            # field) costs one batch, not the whole list.
            if [ -z "$ALL" ] || [ "$n" != "0" ] || [ "$remaining" = "0" ] || [ "$rounds" -ge 40 ]; then break; fi
          done

          {
            echo "## Locations import — applied"
            echo
            echo "Customer **${customer}**. Created **${total}**, failed **${failed}**, still to create **${remaining}**."
            if [ "$failed" != "0" ]; then
              echo
              echo "| Location | Id | Error |"
              echo "|---|---|---|"
              jq -r "${JQ_DEFS}"'"| \(.name|e) | \(.id|e) | \(.error|e) |"' failures.ndjson
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" = "0" ]
