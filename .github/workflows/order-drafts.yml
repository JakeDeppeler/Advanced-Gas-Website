name: Order drafts

# On demand: draft any supplier orders and electrician work orders for jobs
# sold and booked since the last run (Supply › Next week) — this week, and
# next week from Wednesday — and email the office when something new needs
# approving. It normally runs on its own after each ServiceTitan sync.
#
# Nothing is sent to a supplier or the electrician by this; the office
# approves each one on the page. Anything already ordered is never ordered
# again, even if the job moves.
#
# Uses the same two repository secrets as the dashboard sync
# (DASHBOARD_SYNC_URL and CRON_SECRET).

on:
  # No schedule of its own any more: drafting runs after every ServiceTitan
  # sync (dashboard-sync.yml → /api/ordering/draft?mode=refresh), so a newly
  # booked job is drafted within minutes, and the first sync after 6am each
  # weekday is the morning run. A second schedule here would race it. This
  # stays as a Run button to draft on demand.
  workflow_dispatch:
    inputs:
      url:
        description: "Site to run against (default: the DASHBOARD_SYNC_URL host). Set to a Vercel preview URL to test a branch."
        type: string
        required: false

concurrency:
  group: order-drafts
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Draft new orders
        env:
          SYNC_URL: ${{ secrets.DASHBOARD_SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          URL_OVERRIDE: ${{ inputs.url }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Set the DASHBOARD_SYNC_URL and CRON_SECRET repository secrets first."
            exit 1
          fi
          SYNC_URL="$(printf '%s' "$SYNC_URL" | tr -d '[:space:]')"
          BASE="${URL_OVERRIDE:-${SYNC_URL%/api/sync}}"
          BASE="${BASE%/}"
          out="$(curl -sS --fail-with-body --max-time 90 -H "Authorization: Bearer ${CRON_SECRET}" "${BASE}/api/ordering/draft")"
          echo "$out"
          {
            echo "### Order drafts"
            echo '```json'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
