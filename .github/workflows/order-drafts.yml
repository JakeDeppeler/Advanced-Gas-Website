name: Order drafts

# Every weekday morning: draft any supplier orders and electrician work orders
# for jobs sold and booked since the last run (Supply › Next week) — this week
# every day, next week from Wednesday — and email the office when something
# new needs approving. Nothing is sent to a supplier or the electrician by
# this; the office approves each one on the page. Anything already ordered is
# never ordered again, even if the job moves.
#
# Uses the same two repository secrets as the dashboard sync
# (DASHBOARD_SYNC_URL and CRON_SECRET).

on:
  schedule:
    # Two slots so one is 7am Melbourne whatever daylight saving is doing:
    # 20:00 UTC = 7am AEDT, 21:00 UTC = 7am AEST, Sunday–Thursday UTC being
    # Monday–Friday in Melbourne. The route is safe to run twice; the second
    # finds nothing new and sends nothing.
    - cron: "0 20 * * 0-4"
    - cron: "0 21 * * 0-4"
  workflow_dispatch:
    inputs:
      url:
        description: "Site to run against (default: the DASHBOARD_SYNC_URL host). Set to a Vercel preview URL to test a branch."
        type: string
        required: false

concurrency:
  group: order-drafts
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Draft new orders
        env:
          SYNC_URL: ${{ secrets.DASHBOARD_SYNC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          URL_OVERRIDE: ${{ inputs.url }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Set the DASHBOARD_SYNC_URL and CRON_SECRET repository secrets first."
            exit 1
          fi
          SYNC_URL="$(printf '%s' "$SYNC_URL" | tr -d '[:space:]')"
          BASE="${URL_OVERRIDE:-${SYNC_URL%/api/sync}}"
          BASE="${BASE%/}"
          out="$(curl -sS --fail-with-body --max-time 90 -H "Authorization: Bearer ${CRON_SECRET}" "${BASE}/api/ordering/draft")"
          echo "$out"
          {
            echo "### Order drafts"
            echo '```json'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
